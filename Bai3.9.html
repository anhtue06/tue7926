<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <script>
        function load() {
            document.formdn.hoten.focus();
            checkinput();
            document.getElementById("nhap").disabled=true;
        }
        function unhide()
        {
            if(document.getElementById("hoten").value.length!=0)
                document.getElementById("nhap").disabled=false;
        }
        function display() {
            if (document.formdn.hoten.value === "") {
                alert("Bạn chưa nhập tên đăng nhập");
                document.formdn.hoten.focus();
            } else if (document.formdn.matkhau.value === "") {
                alert("Bạn chưa nhập mật khẩu");
                document.formdn.matkhau.focus();
            } else if (document.formdn.matkhau.value.length < 8) {
                alert("Mật khẩu từ 8 kí tự trở lên");
                document.formdn.matkhau.focus();
            } else {
                let user = document.getElementById("hoten").value;
                let pass = document.getElementById("matkhau").value;
                let content = "<table width='350px' border='1' align='center' cellpadding='5' cellspacing='0' bgcolor='#ccc'>";
                content += "<tr><th colspan='2' align='center' height='30px'>THÔNG TIN ĐĂNG NHẬP</th></tr>";
                content += "<tr><td>Username:</td><td>" + user + "</td></tr>";
                content += "<tr><td>Password:</td><td>" + pass + "</td></tr>";
                content += "</table>";
                document.getElementById("test").innerHTML = content;
            }
        }
    </script>
    <style>
        th{
            height:40px;
        }
        table{
            background-color:#d0f3f8;
        }
        input[type="text"],
        input[type="password"]{
            padding:5px;
        }
    </style>
</head>
<body onload="load();">
    <form name="formdn" onsubmit="return false;">
        <table align="center" width="350px" cellpadding="5" cellspacing="0">
            <tr>
                <th colspan="2">THÔNG TIN ĐĂNG KÝ</th>
            </tr>
            <tr>
                <td width="120px">Tên đăng nhập:</td>
                <td>
                    <input type="text" name="hoten" id="hoten" onblur="unhide()">
                </td>
            </tr>
            <tr>
                <td>Mật khẩu:</td>
                <td>
                    <input type="password" name="matkhau" id="matkhau" oninput="checkinput()">
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" id="nhap" value="Nhập" onclick="display();" disabled>
                </td>
            </tr>
        </table>
        <br>
        <div id="test"></div>
    </form>
</body>
</html>
